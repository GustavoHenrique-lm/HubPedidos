
name: Qualidade Contínua

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  quality:
    name: Build, Formatação e Testes
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependências
        run: dotnet restore HubPedidos.slnx

      - name: Compilar solução
        run: dotnet build HubPedidos.slnx --configuration Release --no-restore

      - name: Verificar formatação
        run: dotnet format HubPedidos.slnx --verify-no-changes --no-restore

      - name: Executar testes
        run: dotnet test HubPedidos.Tests --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
